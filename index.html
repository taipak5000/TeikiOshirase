<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>配布タイマー</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f2f7;
    --card: rgba(255, 255, 255, 0.72);
    --card-solid: #ffffff;
    --card-border: rgba(255, 255, 255, 0.6);
    --text: #1c1c1e;
    --text-2: #6e6e73;
    --text-3: #aeaeb2;
    --fill: rgba(120, 120, 128, 0.12);
    --fill-2: rgba(120, 120, 128, 0.2);
    --sep: rgba(60, 60, 67, 0.12);
    --accent: #0a84ff;
    --accent-soft: rgba(10, 132, 255, 0.14);
    --green: #30d158;
    --green-soft: rgba(48, 209, 88, 0.16);
    --orange: #ff9f0a;
    --orange-soft: rgba(255, 159, 10, 0.16);
    --red: #ff453a;
    --ring-track: rgba(120, 120, 128, 0.16);
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
    --spring: cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: rgba(28, 28, 30, 0.72);
      --card-solid: #1c1c1e;
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f5f5f7;
      --text-2: #98989d;
      --text-3: #636366;
      --fill: rgba(120, 120, 128, 0.24);
      --fill-2: rgba(120, 120, 128, 0.32);
      --sep: rgba(84, 84, 88, 0.6);
      --accent-soft: rgba(10, 132, 255, 0.22);
      --green-soft: rgba(48, 209, 88, 0.2);
      --orange-soft: rgba(255, 159, 10, 0.2);
      --ring-track: rgba(120, 120, 128, 0.24);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font: 100%/1.5 -apple-system, BlinkMacSystemFont, system-ui, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 32px);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "tnum";
  }
  .app { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  header { padding: 8px 4px 0; }
  h1 {
    font-size: 2rem; line-height: 1.1; letter-spacing: -0.02em; font-weight: 700; margin: 0;
  }
  .subtitle { color: var(--text-2); margin: 4px 0 0; font-size: 0.95rem; }

  .card {
    background: var(--card);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  @media (prefers-reduced-transparency: reduce) {
    .card { background: var(--card-solid); backdrop-filter: none; -webkit-backdrop-filter: none; }
  }

  /* ---- Timer ---- */
  .timer { padding: 28px 20px 20px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .ring-wrap { position: relative; width: 240px; height: 240px; max-width: 70vw; max-height: 70vw; }
  .ring { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 12; stroke-linecap: round; }
  .ring .track { stroke: var(--ring-track); }
  .ring .bar {
    stroke: var(--accent);
    transition: stroke-dashoffset 0.28s linear, stroke 0.4s var(--spring);
  }
  .ring-wrap.phase-collect .bar { stroke: var(--green); }
  .ring-wrap.phase-ready .bar { stroke: var(--orange); }
  .ring-center {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .time {
    font-size: clamp(2.6rem, 14vw, 3.6rem); line-height: 1; letter-spacing: -0.03em; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .phase { color: var(--text-2); font-size: 0.85rem; font-weight: 500; }
  .phase-pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 600;
    background: var(--fill); color: var(--text-2);
    transition: background 0.3s var(--spring), color 0.3s var(--spring);
  }
  .phase-pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .phase-pill.wait { background: var(--accent-soft); color: var(--accent); }
  .phase-pill.collect { background: var(--green-soft); color: var(--green); }
  .phase-pill.ready { background: var(--orange-soft); color: var(--orange); }

  .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
  .meta > div { background: var(--fill); border-radius: 14px; padding: 10px 12px; }
  .meta .k { font-size: 0.72rem; color: var(--text-2); font-weight: 500; }
  .meta .v { font-size: 1.05rem; font-weight: 600; font-variant-numeric: tabular-nums; }

  .actions { display: flex; gap: 10px; width: 100%; }
  .btn {
    flex: 1; border: 0; border-radius: 16px; padding: 15px 8px; font: inherit; font-size: 1rem; white-space: nowrap; font-weight: 600; cursor: pointer;
    color: #fff; background: var(--accent);
    transform: scale(1); transition: transform 0.18s var(--spring), background 0.25s, opacity 0.25s;
    user-select: none; -webkit-user-select: none;
  }
  .btn:active { transform: scale(0.96); transition-duration: 0.08s; }
  .btn.secondary { background: var(--fill); color: var(--text); }
  .btn.danger { background: var(--fill); color: var(--red); }
  .btn.green { background: var(--green); }
  .btn[disabled] { opacity: 0.4; pointer-events: none; }

  /* ---- Settings list ---- */
  .list { display: flex; flex-direction: column; }
  .list .section-title { padding: 12px 18px 6px; font-size: 0.78rem; font-weight: 600; color: var(--text-2); letter-spacing: 0.02em; text-transform: uppercase; }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; min-height: 52px;
  }
  .row + .row { border-top: 1px solid var(--sep); }
  .row .label { font-size: 1rem; }
  .row .hint { display: block; color: var(--text-2); font-size: 0.78rem; margin-top: 1px; }
  .stepper { display: flex; align-items: center; background: var(--fill); border-radius: 12px; overflow: hidden; }
  .stepper button {
    width: 40px; height: 36px; border: 0; background: transparent; color: var(--accent); font-size: 1.3rem; cursor: pointer; font-weight: 500; line-height: 1;
    transition: background 0.15s;
  }
  .stepper button:active { background: var(--fill-2); }
  .stepper input {
    width: 58px; height: 36px; border: 0; background: transparent; color: var(--text); font: inherit; font-size: 1.05rem; font-weight: 600; text-align: center;
    font-variant-numeric: tabular-nums; outline: none; -moz-appearance: textfield;
  }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .unit { color: var(--text-2); font-size: 0.85rem; margin-left: 6px; min-width: 1.5em; }
  .row .ctl { display: flex; align-items: center; }

  .text-input {
    border: 0; background: var(--fill); border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 1rem; color: var(--text); text-align: right; width: 160px; outline: none;
  }
  .text-input:focus { box-shadow: 0 0 0 3px var(--accent-soft); }

  /* toggle */
  .switch { position: relative; width: 51px; height: 31px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch span {
    position: absolute; inset: 0; border-radius: 999px; background: var(--fill-2); cursor: pointer;
    transition: background 0.25s var(--spring);
  }
  .switch span::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15), 0 1px 1px rgba(0,0,0,0.06);
    transition: transform 0.3s var(--spring);
  }
  .switch input:checked + span { background: var(--green); }
  .switch input:checked + span::after { transform: translateX(20px); }

  .perm { font-size: 0.8rem; color: var(--text-2); }
  .perm.ok { color: var(--green); }
  .perm.bad { color: var(--red); }
  .link-btn { border: 0; background: none; color: var(--accent); font: inherit; font-size: 0.95rem; font-weight: 500; cursor: pointer; padding: 0; }

  /* log */
  .log { padding: 4px 18px 8px; }
  .log-item { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--sep); font-size: 0.9rem; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .log-item:first-child { border-top: 0; }
  .log-empty { color: var(--text-3); font-size: 0.9rem; padding: 8px 0 12px; }

  footer { text-align: center; color: var(--text-3); font-size: 0.78rem; padding: 4px 8px; line-height: 1.6; }

  /* alert overlay */
  .alert {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: rgba(0,0,0,0.35); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease; z-index: 10;
  }
  .alert.show { opacity: 1; pointer-events: auto; }
  .alert .sheet {
    background: var(--card-solid); border-radius: 26px; padding: 28px 24px 22px; width: 100%; max-width: 340px; text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,0.3);
    transform: translateY(24px) scale(0.96); transition: transform 0.4s var(--spring);
  }
  .alert.show .sheet { transform: none; }
  .alert .icon { font-size: 44px; line-height: 1; margin-bottom: 10px; animation: none; }
  .alert.show .icon { animation: pop 0.5s var(--spring); }
  @keyframes pop { 0% { transform: scale(0.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .alert h2 { margin: 0 0 4px; font-size: 1.35rem; letter-spacing: -0.01em; }
  .alert p { margin: 0 0 18px; color: var(--text-2); font-size: 0.95rem; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; animation: none !important; }
    .alert .sheet { transform: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>配布タイマー</h1>
    <p class="subtitle">受け取ってから次の配布まで、自動で何度でも知らせます。</p>
  </header>

  <section class="card timer">
    <div class="ring-wrap" id="ringWrap">
      <svg class="ring" viewBox="0 0 240 240">
        <circle class="track" cx="120" cy="120" r="110"></circle>
        <circle class="bar" id="bar" cx="120" cy="120" r="110"></circle>
      </svg>
      <div class="ring-center">
        <div class="time" id="time">--:--</div>
        <div class="phase" id="phase">停止中</div>
      </div>
    </div>
    <span class="phase-pill" id="pill">待機中</span>

    <div class="meta">
      <div><div class="k">次の配布</div><div class="v" id="nextAt">—</div></div>
      <div><div class="k">通知回数</div><div class="v" id="count">0 回</div></div>
    </div>

    <div class="actions">
      <button class="btn" id="startBtn">開始</button>
      <button class="btn secondary" id="collectBtn" disabled>今受け取った</button>
      <button class="btn danger" id="stopBtn" disabled>停止</button>
    </div>
  </section>

  <section class="card list">
    <div class="section-title">配布の設定</div>
    <div class="row">
      <div><span class="label">アイテム名</span><span class="hint">通知に表示されます</span></div>
      <div class="ctl"><input class="text-input" id="itemName" placeholder="例: スタミナ" maxlength="30"></div>
    </div>
    <div class="row">
      <div><span class="label">配布間隔</span><span class="hint">受け取りから再配布までの時間</span></div>
      <div class="ctl">
        <div class="stepper">
          <button type="button" data-step="minutes" data-d="-1" aria-label="減らす">−</button>
          <input type="number" id="minutes" min="1" max="1440" inputmode="numeric" value="30">
          <button type="button" data-step="minutes" data-d="1" aria-label="増やす">＋</button>
        </div>
        <span class="unit">分</span>
      </div>
    </div>
    <div class="row">
      <div><span class="label">インターバル</span><span class="hint">通知後、受け取りに使う猶予</span></div>
      <div class="ctl">
        <div class="stepper">
          <button type="button" data-step="interval" data-d="-5" aria-label="減らす">−</button>
          <input type="number" id="interval" min="0" max="3600" inputmode="numeric" value="30">
          <button type="button" data-step="interval" data-d="5" aria-label="増やす">＋</button>
        </div>
        <span class="unit">秒</span>
      </div>
    </div>
  </section>

  <section class="card list">
    <div class="section-title">通知</div>
    <div class="row">
      <div><span class="label">サウンド</span><span class="hint">配布時にチャイムを鳴らす</span></div>
      <label class="switch"><input type="checkbox" id="soundOn" checked><span></span></label>
    </div>
    <div class="row">
      <div><span class="label">デスクトップ通知</span><span class="hint" id="permHint">タブを離れていても届きます</span></div>
      <label class="switch"><input type="checkbox" id="notifyOn"><span></span></label>
    </div>
    <div class="row">
      <div><span class="label">バイブレーション</span><span class="hint">対応端末のみ</span></div>
      <label class="switch"><input type="checkbox" id="vibeOn" checked><span></span></label>
    </div>
    <div class="row">
      <span class="label">テスト</span>
      <button class="link-btn" id="testBtn">通知を試す</button>
    </div>
  </section>

  <section class="card list">
    <div class="section-title">履歴</div>
    <div class="log" id="log"><div class="log-empty">まだ通知はありません</div></div>
  </section>

  <footer>設定と進行状況はこの端末に保存されます。ページを閉じても、開き直せば続きから数えます。<br>ブラウザを完全に終了すると通知は届きません。</footer>
</div>

<div class="alert" id="alert" role="alertdialog" aria-live="assertive">
  <div class="sheet">
    <div class="icon">🎁</div>
    <h2 id="alertTitle">配布されました</h2>
    <p id="alertBody">受け取りに行きましょう</p>
    <button class="btn green" id="alertOk">受け取った</button>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const KEY = 'haifu-timer-v1';
  const CIRC = 2 * Math.PI * 110;

  // state
  let s = {
    itemName: '',
    minutes: 30,
    interval: 30,
    soundOn: true,
    notifyOn: false,
    vibeOn: true,
    running: false,
    phase: 'idle',      // idle | wait | collect | ready
    phaseEnd: 0,        // epoch ms when current phase ends
    count: 0,
    log: [],
    notifiedFor: 0,     // phaseEnd value already notified (guard against double fire)
  };

  // ---- persistence ----
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) s = { ...s, ...JSON.parse(raw) };
    } catch (e) {}
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
  }

  // ---- audio ----
  let ctx = null;
  function ensureAudio() {
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
    } catch (e) {}
  }
  function chime() {
    if (!s.soundOn) return;
    ensureAudio();
    if (!ctx) return;
    const t0 = ctx.currentTime;
    const notes = [[880, 0], [1108.7, 0.18], [1318.5, 0.36], [1760, 0.6]];
    notes.forEach(([f, dt]) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + dt);
      g.gain.exponentialRampToValueAtTime(0.35, t0 + dt + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.55);
      o.connect(g).connect(ctx.destination);
      o.start(t0 + dt);
      o.stop(t0 + dt + 0.6);
    });
  }
  function tick() {
    if (!s.soundOn) return;
    ensureAudio();
    if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square'; o.frequency.value = 1200;
    g.gain.setValueAtTime(0.06, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.06);
    o.connect(g).connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.07);
  }

  // ---- notifications ----
  const hasNotif = 'Notification' in window;
  function updatePermHint() {
    const el = $('permHint');
    el.className = 'hint perm';
    if (!hasNotif) { el.textContent = 'このブラウザは非対応です'; el.classList.add('bad'); $('notifyOn').disabled = true; return; }
    if (Notification.permission === 'granted') { el.textContent = '許可済み・タブを離れていても届きます'; el.classList.add('ok'); }
    else if (Notification.permission === 'denied') { el.textContent = 'ブラウザで通知がブロックされています'; el.classList.add('bad'); }
    else { el.textContent = 'オンにすると許可を求めます'; }
  }
  async function requestPerm() {
    if (!hasNotif) return false;
    if (Notification.permission === 'granted') return true;
    try { const r = await Notification.requestPermission(); updatePermHint(); return r === 'granted'; } catch (e) { return false; }
  }
  function notify(title, body) {
    if (!s.notifyOn || !hasNotif || Notification.permission !== 'granted') return;
    try {
      const n = new Notification(title, { body, tag: 'haifu-timer', renotify: true, requireInteraction: true });
      n.onclick = () => { window.focus(); n.close(); };
    } catch (e) {}
  }
  function vibrate() {
    if (s.vibeOn && navigator.vibrate) { try { navigator.vibrate([200, 100, 200, 100, 400]); } catch (e) {} }
  }

  // ---- helpers ----
  const pad = (n) => String(n).padStart(2, '0');
  function fmtDur(ms) {
    const t = Math.max(0, Math.ceil(ms / 1000));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = t % 60;
    return h > 0 ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
  }
  function fmtClock(ms) {
    const d = new Date(ms);
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function fmtClockS(ms) {
    const d = new Date(ms);
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }
  const label = () => s.itemName.trim() || 'アイテム';
  const waitMs = () => Math.max(1, s.minutes) * 60000;
  const intervalMs = () => Math.max(0, s.interval) * 1000;

  // ---- phase control ----
  function startWait(from = Date.now()) {
    s.phase = 'wait';
    s.phaseEnd = from + waitMs();
    s.running = true;
    save();
  }
  function fire() {
    // called when wait phase ends
    if (s.notifiedFor === s.phaseEnd) return;
    s.notifiedFor = s.phaseEnd;
    s.count += 1;
    s.log.unshift({ at: Date.now(), n: s.count });
    s.log = s.log.slice(0, 20);
    chime(); vibrate();
    notify(`${label()}が配布されました`, `受け取りに行きましょう。${s.interval > 0 ? `${s.interval}秒後に次のタイマーが始まります。` : ''}`);
    showAlert(`${label()}が配布されました`, s.interval > 0 ? `${s.interval}秒後に自動で次の${s.minutes}分を数え始めます` : `次の${s.minutes}分を数え始めました`);
    if (intervalMs() > 0) {
      s.phase = 'collect';
      s.phaseEnd = Date.now() + intervalMs();
    } else {
      startWait(Date.now());
    }
    save();
    renderLog();
  }
  function stop() {
    s.running = false; s.phase = 'idle'; s.phaseEnd = 0;
    save(); hideAlert(); render();
  }

  // Catch up: if the page was closed / throttled across one or more phase boundaries, roll forward.
  function advance() {
    if (!s.running) return;
    const now = Date.now();
    let guard = 0;
    while (now >= s.phaseEnd && guard++ < 1000) {
      if (s.phase === 'wait') {
        fire();
      } else if (s.phase === 'collect') {
        startWait(s.phaseEnd);
      } else {
        break;
      }
    }
  }

  // ---- render ----
  let lastSec = null;
  function render() {
    const now = Date.now();
    const ringWrap = $('ringWrap'), bar = $('bar'), pill = $('pill');
    let remaining = 0, total = 1;

    ringWrap.className = 'ring-wrap';
    if (!s.running) {
      $('time').textContent = fmtDur(waitMs());
      $('phase').textContent = '停止中';
      pill.className = 'phase-pill'; pill.textContent = '待機中';
      bar.style.strokeDashoffset = 0;
      $('nextAt').textContent = '—';
    } else if (s.phase === 'wait') {
      remaining = s.phaseEnd - now; total = waitMs();
      $('time').textContent = fmtDur(remaining);
      $('phase').textContent = '次の配布まで';
      pill.className = 'phase-pill wait'; pill.textContent = `${label()} を待機中`;
      ringWrap.classList.add('phase-wait');
      bar.style.strokeDashoffset = CIRC * (1 - Math.min(1, Math.max(0, remaining / total)));
      $('nextAt').textContent = fmtClock(s.phaseEnd);
      const secLeft = Math.ceil(remaining / 1000);
      if (secLeft <= 3 && secLeft > 0 && secLeft !== lastSec) tick();
      lastSec = secLeft;
    } else if (s.phase === 'collect') {
      remaining = s.phaseEnd - now; total = intervalMs();
      $('time').textContent = fmtDur(remaining);
      $('phase').textContent = '受け取り中 (インターバル)';
      pill.className = 'phase-pill collect'; pill.textContent = '配布されました';
      ringWrap.classList.add('phase-collect');
      bar.style.strokeDashoffset = CIRC * (1 - Math.min(1, Math.max(0, remaining / total)));
      $('nextAt').textContent = fmtClock(s.phaseEnd + waitMs());
    }
    $('count').textContent = `${s.count} 回`;

    $('startBtn').disabled = s.running;
    $('startBtn').textContent = s.running ? '実行中' : '開始';
    $('stopBtn').disabled = !s.running;
    $('collectBtn').disabled = !s.running;
  }
  function renderLog() {
    const el = $('log');
    if (!s.log.length) { el.innerHTML = '<div class="log-empty">まだ通知はありません</div>'; return; }
    el.innerHTML = s.log.map(l => `<div class="log-item"><span>${l.n} 回目</span><span>${fmtClockS(l.at)}</span></div>`).join('');
  }
  function renderSettings() {
    $('itemName').value = s.itemName;
    $('minutes').value = s.minutes;
    $('interval').value = s.interval;
    $('soundOn').checked = s.soundOn;
    $('notifyOn').checked = s.notifyOn && hasNotif && Notification.permission === 'granted';
    $('vibeOn').checked = s.vibeOn;
  }

  // ---- alert overlay ----
  function showAlert(t, b) {
    $('alertTitle').textContent = t; $('alertBody').textContent = b;
    $('alert').classList.add('show');
    document.title = `🎁 ${label()}配布中 — 配布タイマー`;
  }
  function hideAlert() { $('alert').classList.remove('show'); document.title = '配布タイマー'; }
  $('alertOk').addEventListener('click', hideAlert);
  $('alert').addEventListener('click', (e) => { if (e.target === $('alert')) hideAlert(); });

  // ---- main loop (absolute-time based; robust against tab throttling) ----
  function loop() {
    advance();
    render();
  }
  setInterval(loop, 250);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loop(); });
  window.addEventListener('focus', loop);

  // ---- events ----
  $('startBtn').addEventListener('click', () => {
    ensureAudio();
    commitInputs();
    s.count = 0; s.notifiedFor = 0;
    hideAlert();
    startWait(Date.now());
    render();
  });
  $('stopBtn').addEventListener('click', stop);
  $('collectBtn').addEventListener('click', () => {
    // realign: the user picked the item up right now -> restart the wait from now
    ensureAudio();
    hideAlert();
    startWait(Date.now());
    render();
  });
  $('testBtn').addEventListener('click', async () => {
    ensureAudio();
    chime(); vibrate();
    if (s.notifyOn) { await requestPerm(); notify('テスト通知', '配布タイマーからの通知はこのように届きます'); }
    showAlert('テスト', 'このように表示され、音が鳴ります');
  });

  function commitInputs() {
    s.itemName = $('itemName').value;
    s.minutes = clamp(parseInt($('minutes').value, 10) || 1, 1, 1440);
    s.interval = clamp(parseInt($('interval').value, 10) || 0, 0, 3600);
    $('minutes').value = s.minutes; $('interval').value = s.interval;
    save();
  }
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  document.querySelectorAll('.stepper button').forEach(b => {
    b.addEventListener('click', () => {
      const inp = $(b.dataset.step), d = parseInt(b.dataset.d, 10);
      const min = parseInt(inp.min, 10), max = parseInt(inp.max, 10);
      inp.value = clamp((parseInt(inp.value, 10) || 0) + d, min, max);
      commitInputs(); render();
    });
  });
  ['minutes', 'interval', 'itemName'].forEach(id => {
    $(id).addEventListener('change', () => { commitInputs(); render(); });
  });
  $('soundOn').addEventListener('change', (e) => { s.soundOn = e.target.checked; if (s.soundOn) { ensureAudio(); } save(); });
  $('vibeOn').addEventListener('change', (e) => { s.vibeOn = e.target.checked; save(); });
  $('notifyOn').addEventListener('change', async (e) => {
    if (e.target.checked) {
      const ok = await requestPerm();
      s.notifyOn = ok; e.target.checked = ok;
    } else {
      s.notifyOn = false;
    }
    save(); updatePermHint();
  });

  // ---- init ----
  load();
  $('bar').style.strokeDasharray = CIRC;
  renderSettings();
  updatePermHint();
  renderLog();
  loop();
})();
</script>
</body>
</html>
